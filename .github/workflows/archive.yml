name: store maven articfacts in archive branch

permissions:
  contents: write

on:
  push:
    branches: [ master ]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      BRANCH: archive/artifacts-${GITHUB_RUN_ID}
    steps:
      - name: Checkout repo and prepare branch
        id: prepare_branch
        run: |
          set -euo pipefail
          git fetch origin archive || true
          git checkout -b "${ BRANCH }"

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: ci_artifacts
          path: .

      - name: List changes
        run: |
          git diff --name-only

      - name: Commit & push branch
        id: push_branch
        run: |
          set -euo pipefail
          git commit -m "Build artifacts from CI run ${GITHUB_RUN_ID}"
          git push origin "${ BRANCH }"
          echo "BRANCH=${ BRANCH }" >> $GITHUB_OUTPUT

      - name: Create PR to archive branch
        uses: actions/github-script@v6
        with:
          script: |
            const branch = process.env.BRANCH
            await github.pulls.create({ owner: context.repo.owner, repo: context.repo.repo, head: branch, base: 'archive', title: `Add artifacts (${branch})`, body: `Artifacts added by CI: ${branch}` })
        env:
          BRANCH: ${{ steps.prepare_branch.outputs.BRANCH }}
