name: store maven articfacts in archive branch

permissions:
  contents: write

on:
  push:
    branches: [ master ]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for built artifacts
        run: |
          set -e
          ARTIFACT_ID=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          CURRENT_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "Looking for artifacts for version ${CURRENT_VERSION}..."
          rm -f artifact_dirs.txt || true
          for f in $(find . -path '*/target/*' -type f -name "*.jar" ); do
            # determine module directory (parent of target)
            moduleDir=$(dirname "$(dirname "$f")")
            artifactId=""
            if [ -f "$moduleDir/pom.xml" ]; then
              artifactId=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId -f "$moduleDir/pom.xml" 2>/dev/null || true)
            fi
            if [ -z "$artifactId" ]; then
              # fallback: infer artifactId from file name (strip version and classifier)
              artifact=$(basename "$f")
              artifactId=$(echo "$artifact" | sed -E 's/-[0-9]+(\.[0-9a-zA-Z_\-]+)*(-[a-zA-Z]+)?\.jar$//' )
            fi
            if [ -z "$artifactId" ]; then
              artifactId="unknown-artifact"
            fi
            dest="$artifactId"
            echo "Found $(basename "$f") in $moduleDir -> placing into directory: $dest"
            mkdir -p "$dest"
            cp "$f" "$dest" || true
            echo "$dest" >> artifact_dirs.txt
          done
          if [ -f artifact_dirs.txt ]; then
            sort -u artifact_dirs.txt -o artifact_dirs.txt || true
            echo "Artifact directories created:"; cat artifact_dirs.txt
            while read -r d; do
              echo "Listing $d:"; ls -la "$d" || true
            done < artifact_dirs.txt
          else
            echo "No artifacts found for version ${CURRENT_VERSION}"; exit 0
          fi

      - name: Prepare archive branch
        id: prepare_archive_branch
        run: |
          set -e
          ARTIFACT_ID=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          CURRENT_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          ARTDIRS_FILE=artifact_dirs.txt
          if [ ! -f "$ARTDIRS_FILE" ]; then
            echo "No artifact dirs file found: $ARTDIRS_FILE"; exit 0
          fi
          ARTDIRS=$(cat "$ARTDIRS_FILE")
          if [ -z "$ARTDIRS" ]; then
            echo "No artifact directories listed in $ARTDIRS_FILE"; exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if archive branch exists remotely
          if git ls-remote --heads origin archive | grep -q refs/heads/archive; then
            echo "archive branch exists, comparing files..."
            CHANGED=0
            for dir in $ARTDIRS; do
              for f in "$dir"/*; do
                name=$(basename "$f")
                if git show origin/archive:"$dir/$name" > /tmp/oldfile 2>/dev/null; then
                  if ! cmp -s "$f" /tmp/oldfile; then
                    echo "File differs: $dir/$name"
                    CHANGED=1
                    break 2
                  fi
                else
                  echo "File not present on archive: $dir/$name"
                  CHANGED=1
                  break 2
                fi
              done
            done
            if [ "$CHANGED" -eq 0 ]; then
              echo "No new artifact changes compared to archive branch; skipping PR"
              exit 0
            fi
          else
            echo "archive branch does not exist; will create PR"
          fi

          VERSION=$CURRENT_VERSION
          BRANCH="archive/artifacts-${VERSION}-${GITHUB_RUN_ID}"
          git fetch origin archive || true
          git checkout -b "$BRANCH"
          for dir in $ARTDIRS; do
            git.rm -r --ignore-unmatch "$dir" || true
            git rm -r --ignore-unmatch "./$dir" || true || true
            if [ -d "./$dir" ]; then
              echo "Directory $dir already exists in working tree on this branch; will replace it"
              git rm -r --ignore-unmatch "./$dir" || true
            fi
            cp -r "$dir" .
            git add "$dir"
          done
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"; exit 0
          fi
          git commit -m "Add built artifacts for ${VERSION}"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create PR to archive branch
        uses: actions/github-script@v6
        with:
          script: |
            const branch = process.env.BRANCH
            await github.pulls.create({ owner: context.repo.owner, repo: context.repo.repo, head: branch, base: 'archive', title: `Add artifacts (${branch})`, body: `Artifacts for ${branch}` })
        env:
          BRANCH: ${{ steps.prepare_archive_branch.outputs.BRANCH }}
