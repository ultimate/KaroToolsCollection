name: store maven articfacts in archive branch

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [ master ]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare branch
        id: prepare_branch
        run: |
          set -euo pipefail
          # ensure we have remote refs
          git fetch --no-tags --prune origin || true

          # compute branch name (resolve run id) and create a new branch based on origin/archive
          BRANCH="archive-artifacts-${GITHUB_RUN_ID}"
          echo "Computed BRANCH=$BRANCH"
          git fetch origin archive:refs/remotes/origin/archive || true
          git checkout -b "$BRANCH" origin/archive
          # configure committer identity for the local repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # export BRANCH for subsequent steps and as step output
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_OUTPUT

      - name: Debug list repo after branch prepare
        run: |
          echo "Repository root: $(pwd)"
          echo "Git branch:"; git branch --show-current || true
          echo "Git status:"; git status --porcelain || true
          echo "Top-level listing:"; ls -la || true
          echo "All files count:"; find . -type f | wc -l || true
          echo "Top 200 files by size:"; find . -type f -exec ls -sh {} + | sort -h -r | head -n 200 || true

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: ci_artifacts
          path: .

      - name: List & add new artifacts
        id: stage_new_artifacts
        run: |
          echo "Working tree status (after download):"
          git status --porcelain || true

          # Discard any modifications to already-tracked files so we only consider newly added artifacts
          git checkout -- . || true
          echo "Discarded changes to tracked files. Status now:"
          git status --porcelain || true

          # Stage all downloaded files and compare the index to origin/archive
          git add -A

          # If there are no differences vs origin/archive, nothing to commit
          if [ -z "$(git diff --name-only --cached origin/archive --)" ]; then
            echo "No differences vs origin/archive; nothing to commit. Exiting."
            exit 0
          fi

          echo "Differences found vs origin/archive; staged files:"
          git diff --name-only --cached origin/archive -- || true

      - name: Commit & push branch
        id: push_branch
        run: |
          set -euo pipefail
          # ensure everything is staged (defensive)
          git add -A

          # commit only if there are staged changes
          if git diff --cached --quiet; then
            echo "No staged changes to commit; skipping push."; exit 0
          fi

          git commit -m "Build artifacts from CI run ${GITHUB_RUN_ID}"
          git push origin "${BRANCH}"
          echo "BRANCH=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Create PR to archive branch
        uses: actions/github-script@v6
        with:
          script: |
            const branch = process.env.BRANCH
            await github.rest.pulls.create({ owner: context.repo.owner, repo: context.repo.repo, head: branch, base: 'archive', title: `Add artifacts (${branch})`, body: `Artifacts added by CI: ${branch}` })
        env:
          BRANCH: ${{ steps.prepare_branch.outputs.BRANCH }}
