name: store maven articfacts in archive branch

permissions:
  contents: write

on:
  push:
    branches: [ master ]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      BRANCH: archive/artifacts-${GITHUB_RUN_ID}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare branch
        id: prepare_branch
        run: |
          set -euo pipefail
          # ensure we have remote refs
          git fetch --no-tags --prune origin || true

          # create local branch from origin/${BRANCH} if it exists remotely, else create new branch
          if git rev-parse --verify --quiet "${BRANCH}" >/dev/null; then
            git checkout "${BRANCH}"
          elif git ls-remote --heads origin "${BRANCH}" | grep -q "refs/heads/${BRANCH}"; then
            git fetch origin "${BRANCH}:${BRANCH}" || true
            git checkout "${BRANCH}"
          else
            git checkout -b "${BRANCH}"
          fi
          # configure committer identity for the local repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: ci_artifacts
          path: .

      - name: List & add new artifacts
        id: stage_new_artifacts
        run: |
          echo "Working tree status (after download):"
          git status --porcelain || true

          # Discard any modifications to already-tracked files so we only consider newly added artifacts
          git checkout -- . || true

          # Find newly added/untracked files (these are the artifacts we just downloaded)
          mapfile -d '' new_files < <(git ls-files --others --exclude-standard -z || true)
          if [ ${#new_files[@]} -eq 0 ]; then
            echo "No new (untracked) files found; nothing to commit. Exiting."
            exit 0
          fi

          echo "Checking new files against origin/archive and staging only missing/different ones:"
          staged_any=0
          for f in "${new_files[@]}"; do
            # remove trailing NUL if present
            file="$f"
            echo "Checking $file"

            # compare to archive branch if it exists remotely
            if git ls-remote --heads origin archive | grep -q refs/heads/archive; then
              if git show origin/archive:"$file" > /tmp/oldfile 2>/dev/null; then
                if cmp -s "$file" /tmp/oldfile; then
                  echo "File identical on archive: $file -- removing local copy"
                  rm -f "$file"
                  continue
                else
                  echo "File differs from archive: $file -- staging"
                fi
              else
                echo "File not present on archive: $file -- staging"
              fi
            else
              echo "Archive branch not present remotely; staging $file"
            fi

            git add -- "$file"
            staged_any=1
          done

          if [ $staged_any -eq 0 ]; then
            echo "No new/different artifacts to commit after comparing with archive; exiting."
            exit 0
          fi

          echo "Staged new/different files:"
          git diff --cached --name-only || true

      - name: Commit & push branch
        id: push_branch
        run: |
          set -euo pipefail
          # ensure everything is staged (defensive)
          git add -A

          # commit only if there are staged changes
          if git diff --cached --quiet; then
            echo "No staged changes to commit; skipping push."; exit 0
          fi

          git commit -m "Build artifacts from CI run ${GITHUB_RUN_ID}"
          git push origin "${BRANCH}"
          echo "BRANCH=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Create PR to archive branch
        uses: actions/github-script@v6
        with:
          script: |
            const branch = process.env.BRANCH
            await github.pulls.create({ owner: context.repo.owner, repo: context.repo.repo, head: branch, base: 'archive', title: `Add artifacts (${branch})`, body: `Artifacts added by CI: ${branch}` })
        env:
          BRANCH: ${{ steps.prepare_branch.outputs.BRANCH }}
