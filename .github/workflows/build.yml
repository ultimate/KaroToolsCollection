name: maven test & build

permissions:
  contents: read

on:
  workflow_dispatch: {}
  workflow_call: {}
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Create login.properties from secrets
        run: |
          set -e
          API4J_FILE=KaroAPI4J/src/test/resources/login.properties
          MUSKEL_FILE=KaroMUSKEL-Java/src/test/resources/login.properties
          RAUPE_FILE=KaroRAUPE/src/test/resources/login.properties

          printf 'karoAPI.images=false\n' > "$API4J_FILE"
          printf 'karoAPI.user=%s\n' "${{ secrets.KARO_API_USER }}" >> "$API4J_FILE"
          printf 'karoAPI.password=%s\n' "${{ secrets.KARO_API_PASS }}" >> "$API4J_FILE"
          printf 'karoAPI.user2=%s\n' "${{ secrets.KARO_API_USER2 }}" >> "$API4J_FILE"
          printf 'karoAPI.password2=%s\n' "${{ secrets.KARO_API_PASS2 }}" >> "$API4J_FILE"
          printf 'karoWIKI.user=%s\n' "${{ secrets.KARO_WIKI_USER }}" >> "$API4J_FILE"
          printf 'karoWIKI.password=%s\n' "${{ secrets.KARO_WIKI_PASS }}" >> "$API4J_FILE"
          chmod 600 "$API4J_FILE" || true

          printf 'karoAPI.images=false\n' > "$MUSKEL_FILE"
          printf 'karoAPI.user=%s\n' "${{ secrets.KARO_API_USER }}" >> "$MUSKEL_FILE"
          printf 'karoAPI.password=%s\n' "${{ secrets.KARO_API_PASS }}" >> "$MUSKEL_FILE"
          printf 'karoWIKI.user=%s\n' "${{ secrets.KARO_WIKI_USER }}" >> "$MUSKEL_FILE"
          printf 'karoWIKI.password=%s\n' "${{ secrets.KARO_WIKI_PASS }}" >> "$MUSKEL_FILE"
          chmod 600 "$MUSKEL_FILE" || true

          printf 'karoAPI.images=false\n' > "$RAUPE_FILE"
          printf 'karoAPI.user=%s\n' "${{ secrets.KARO_API_USER }}" >> "$RAUPE_FILE"
          printf 'karoAPI.password=%s\n' "${{ secrets.KARO_API_PASS }}" >> "$RAUPE_FILE"
          printf 'karoRAUPE.trigger=nomessage\n' >> "$RAUPE_FILE"
          printf 'karoRAUPE.timeout=300\n' >> "$RAUPE_FILE"
          printf 'karoRAUPE.interval=300\n' >> "$RAUPE_FILE"
          printf 'karoRAUPE.message=\n' >> "$RAUPE_FILE"
          printf 'karoRAUPE.strict=false\n' >> "$RAUPE_FILE"
          chmod 600 "$RAUPE_FILE" || true

      - name: Build with Maven
        run: mvn -B -V -DskipTests=${{ vars.SKIP_TESTS }} -Dtest='!KaroAPICacheTest#test_imageCaching' verify

      - name: Collect built jars
        run: |
          set -euo pipefail
          rm -rf ci_artifacts || true
          mkdir -p ci_artifacts
          while IFS= read -r -d '' jar; do
            moduleDir=$(dirname "$(dirname "$jar")")
            jarName=$(basename "$jar")
            artifactId=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId -f "$moduleDir/pom.xml" 2>/dev/null || true)
            if [ -z "$artifactId" ]; then
              artifactId=$(echo "$jarName" | sed -E 's/-[0-9]+(\.[0-9a-zA-Z_\-]+)*(-[a-zA-Z]+)?\.jar$//')
            fi
            if [ -z "$artifactId" ]; then
              artifactId="unknown-artifact"
            fi
            mkdir -p "ci_artifacts/$artifactId"
            cp "$jar" "ci_artifacts/$artifactId/"
          done < <(find . -path '*/target/*.jar' -print0) || true
          echo "Collected artifacts:"; ls -R ci_artifacts || true
          echo "Artifact count:"; find ci_artifacts -type f -print | wc -l || true
          echo "Artifact listing with sizes:"; find ci_artifacts -type f -exec ls -lh {} \; || true

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci_artifacts
          path: ci_artifacts
