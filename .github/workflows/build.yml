name: Reusable Maven build

on:
  workflow_call:
    inputs:
      upload_artifacts:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Create login.properties from secrets
        run: |
          set -e
          API4J_FILE=KaroAPI4J/src/test/resources/login.properties
          MUSKEL_FILE=KaroMUSKEL-Java/src/test/resources/login.properties

          printf 'karoAPI.images=false\n' > "$API4J_FILE"
          printf 'karoAPI.user=%s\n' "${{ secrets.KARO_API_USER }}" >> "$API4J_FILE"
          printf 'karoAPI.password=%s\n' "${{ secrets.KARO_API_PASS }}" >> "$API4J_FILE"
          printf 'karoAPI.user2=%s\n' "${{ secrets.KARO_API_USER2 }}" >> "$API4J_FILE"
          printf 'karoAPI.password2=%s\n' "${{ secrets.KARO_API_PASS2 }}" >> "$API4J_FILE"
          printf 'karoWIKI.user=%s\n' "${{ secrets.KARO_WIKI_USER }}" >> "$API4J_FILE"
          printf 'karoWIKI.password=%s\n' "${{ secrets.KARO_WIKI_PASS }}" >> "$API4J_FILE"
          chmod 600 "$API4J_FILE" || true

          printf 'karoAPI.images=false\n' > "$MUSKEL_FILE"
          printf 'karoAPI.user=%s\n' "${{ secrets.KARO_API_USER }}" >> "$MUSKEL_FILE"
          printf 'karoAPI.password=%s\n' "${{ secrets.KARO_API_PASS }}" >> "$MUSKEL_FILE"
          printf 'karoWIKI.user=%s\n' "${{ secrets.KARO_WIKI_USER }}" >> "$MUSKEL_FILE"
          printf 'karoWIKI.password=%s\n' "${{ secrets.KARO_WIKI_PASS }}" >> "$MUSKEL_FILE"
          chmod 600 "$MUSKEL_FILE" || true

      - name: Build with Maven
        run: mvn -B -V -DskipTests=false -Dtest='!KaroAPICacheTest#test_imageCaching' verify
